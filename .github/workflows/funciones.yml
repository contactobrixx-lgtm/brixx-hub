# Publica las Edge Functions de supabase/functions en Supabase.
#
# - Al mergear a main un cambio en supabase/functions: publica.
# - A mano: pestaña Actions → "Funciones de Supabase" → Run workflow.
#
# Necesita el secret SUPABASE_ACCESS_TOKEN (token personal de Supabase).
# El id del proyecto se saca de SUPABASE_DB_URL (el mismo que usan las migraciones).
# Si falta el token, avisa y no publica (no rompe el merge).

name: Funciones de Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/funciones.yml'
  workflow_dispatch:

concurrency:
  group: supabase-funciones
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publicar:
    name: Publicar funciones
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta el secret SUPABASE_ACCESS_TOKEN: las funciones no se publicaron. Ver README → 'Grabaciones de reuniones'."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # postgresql://postgres.<ref>:<clave>@... → <ref>
          ref=$(printf '%s' "$SUPABASE_DB_URL" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+):.*#\2#p')
          if [ -z "$ref" ]; then
            echo "::error::No se pudo sacar el id del proyecto de SUPABASE_DB_URL (tiene que empezar con postgresql://postgres.<id>:)."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ok == 'true'
        with:
          version: 3.1.0

      - name: Publicar
        if: steps.config.outputs.ok == 'true'
        # --no-verify-jwt: la función valida ella misma la sesión del usuario y el aviso firmado de AssemblyAI.
        run: supabase functions deploy --remote="${{ steps.config.outputs.ref }}" --no-verify-jwt --use-api --yes
