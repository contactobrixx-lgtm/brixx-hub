<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Propuesta · Alcione Deco</title>
<meta name="robots" content="noindex" />
<style>
  /* Mismos valores que los tokens de src/index.css (página estática, fuera de la app) */
  :root { --fondo: #121316; --superficie: #1b1d22; --borde: #33363e; --texto: #edebe5; --tenue: #a2a6af; --acento: #2d61fe; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--fondo); color: var(--texto); font-family: 'Figtree', system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  video { width: 100%; max-width: 1280px; max-height: calc(100vh - 90px); aspect-ratio: 16 / 9; border-radius: 14px; background: #000; box-shadow: 0 0 0 1px var(--borde); }
  .pie { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; font-size: 14px; color: var(--tenue); }
  a { color: #fff; background: var(--acento); text-decoration: none; font-weight: 700; border-radius: 11px; padding: 10px 16px; }
</style>
</head>

<main>
  <video src="propuesta-alcione-deco.mp4" poster="propuesta-alcione-deco.jpg" controls playsinline preload="metadata"></video>
